# Development stack (§932): one service, because CKOS is one binary.
#
# This file used to also start Neo4j, Qdrant and Redis, described as "the real
# public images that back the §935 data layer". They backed nothing. CKOS is
# std-only with zero external dependencies — there is no Neo4j driver, no
# Qdrant client and no Redis client anywhere in the workspace (verified: no
# match for any of them, or for their ports, outside comments). Bringing the
# stack up started three databases that nothing ever connected to, while
# implying an integration that does not exist and that
# `docs/implementation-status.md` explicitly places outside v1 (§936: SQL and
# vector backends need a driver, which the dependency policy forbids).
#
# If a persistent backend is ever added behind the `memory::Storage` or
# `graph::GraphStore` seams, add its service back *together with* the code
# that talks to it.
#
#   docker compose up --build     # then open http://127.0.0.1:8080
services:
  ckos:
    build: .
    image: ckos:dev
    # The image already defaults to the gateway; stated here so the port
    # mapping below is obviously connected to something that listens.
    command: ["serve", "--host", "0.0.0.0", "--port", "8080", "--session-root", "/data"]
    ports:
      # Published on the loopback interface only. The gateway has no TLS and
      # no authentication (see the `ckos_web` crate docs), so binding it to
      # 0.0.0.0 on the host would expose an unauthenticated control surface to
      # the local network.
      - "127.0.0.1:8080:8080"
    volumes:
      - sessions:/data

volumes:
  sessions:
