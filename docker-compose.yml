# Minimal development environment (§932).
#
# `ckos` is the kernel/CLI image built from the Dockerfile; the planner,
# reasoner and verifier agents (§932) are the same binary run in different
# roles, so they are represented here as one service for the dev stack. The
# data services use the real public images that back the §935 data layer:
# Neo4j (graph DB), Qdrant (vector DB) and Redis (cache).
services:
  ckos:
    build: .
    image: ckos:dev
    command: ["help"]
    depends_on:
      - graph-db
      - vector-db
      - redis

  graph-db: # §897 knowledge graph backend
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/ckos-dev
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt

  vector-db: # §944/§950 vector search backend
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  redis: # §958 search/result cache backend
    image: redis:7
    ports:
      - "6379:6379"
