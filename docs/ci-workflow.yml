name: CI

# Continuous integration for the CKOS workspace (§905): build, test, lint and
# format checks on every push and pull request.
#
# NOTE: copy this file to `.github/workflows/ci.yml` to activate it. It lives
# under docs/ because the automation that created this branch cannot push files
# under .github/workflows/ (it lacks the `workflows` permission). The contents
# are ready to use as-is.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # One script is the single source of truth for what "green" means, so CI,
      # the local pre-commit loop and a new contributor cannot drift apart.
      # (They had: this job previously skipped the rustdoc gate entirely and ran
      # clippy without `-D warnings`, so it was weaker than the local checks.)
      - name: All gates (format, clippy, rustdoc, tests)
        run: ./scripts/check.sh

      - name: Smoke-test the CLI
        run: |
          cargo run -q -p ckos-cli -- version
          cargo run -q -p ckos-cli -- run "research the Transformer paper"
          cargo run -q -p ckos-cli -- kql 'FIND Concept "Transformer" RELATED Algorithm'
          # The §938 ingest path, end to end, on a throwaway session.
          sess=$(mktemp -d)
          printf 'The Photon Accelerator is built by Vector Labs.\n' > "$sess/note.md"
          cargo run -q -p ckos-cli -- index "$sess" "$sess/note.md"
          cargo run -q -p ckos-cli -- search "$sess" "Vector Labs"
