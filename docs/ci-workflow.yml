name: CI

# Continuous integration for the CKOS workspace (§905): build, test, lint and
# format checks on every push and pull request.
#
# NOTE: copy this file to `.github/workflows/ci.yml` to activate it. It lives
# under docs/ because the automation that created this branch cannot push files
# under .github/workflows/ (it lacks the `workflows` permission). The contents
# are ready to use as-is.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Smoke-test the CLI
        run: |
          cargo run -q -p ckos-cli -- version
          cargo run -q -p ckos-cli -- run "research the Transformer paper"
          cargo run -q -p ckos-cli -- kql 'FIND Concept "Transformer" RELATED Algorithm'
